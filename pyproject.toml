[project]
name = "fastapi-multipart-demo"
version = "0.1.0"
description = "FastAPI Demo Application with Lambda and API Gateway integration"
authors = [
    {name = "AbinashG",email = "abhi24964@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi (>=0.122.0,<0.123.0)",
    "boto3 (>=1.41.5,<2.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "mangum (>=0.19.0,<0.20.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "python-dotenv (>=1.2.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
